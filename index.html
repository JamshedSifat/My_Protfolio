    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sifat",
        "jobTitle": "Full Stack Developer",
        "url": "https://sifat.dev/",
        "image": "https://sifat.dev/og-image.png",
        "description": "Full Stack Developer building production-ready web applications with React, Django, PostgreSQL and AI integrations.",
        "knowsAbout": ["React", "JavaScript", "Django", "Django REST Framework", "PostgreSQL", "MongoDB", "Docker", "AI Integration"],
        "sameAs": ["https://github.com/sifat", "https://www.linkedin.com/in/sifat"]
      }
    </script>

    <!-- Prevent theme flash: runs before first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var cached = JSON.parse(localStorage.getItem("sp.v1.content") || "null");
          var preferred = cached && cached.settings && cached.settings.defaultTheme;
          var fallback = preferred === "light" || preferred === "dark" ? preferred : system;
          var theme = stored === "light" || stored === "dark" ? stored : fallback;
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

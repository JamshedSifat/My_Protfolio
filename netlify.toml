# ── Netlify deployment (Option B) ────────────────────────────────────────
# Single source of truth for Netlify. Do NOT also add a `_redirects` or
# `_headers` file — netlify.toml would take precedence and the duplicates
# would be easy to drift out of sync.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Fail loudly on lockfile drift instead of silently resolving it.
  NPM_FLAGS = "--include=dev"

# ── Routing ──────────────────────────────────────────────────────────────
# The app uses HashRouter, so a single SPA fallback covers every path.
# `force = false` lets real files (favicon, og-image, sitemap, robots) win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ── Headers ──────────────────────────────────────────────────────────────
# index.html IS the entire app (single-file build), so it must never be
# cached — otherwise visitors keep seeing a stale bundle after a deploy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Immutable-ish static assets are safe to cache for a week.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"
